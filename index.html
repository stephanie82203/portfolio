<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CHENG's Portfolio</title>
    <meta name="description" content="Stephanie Cheng is a statistics graduate with a minor in economics, looking for analyst roles in data, business and reporting.">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

    <meta property="og:title" content="Stephanie Cheng - Data Analyst">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- Runs before paint: turn on animations, and if the page opens at a #section, show it instantly -->
    <script>
        (function (d) {
        d.classList.remove("no-js"); d.classList.add("js");
        if (location.hash.length > 1) d.classList.add("jumping");
        })(document.documentElement);
    </script>

    <!-- Content per section (Edit these) -->
    <script src="data/profile.js" defer></script>
    <script src="data/experiences.js" defer></script>
    <script src="data/skills.js" defer></script>
    <script src="data/projects.js" defer></script>
    <script src="data/education.js" defer></script>
    <script src="data/blog.js" defer></script>

    <script src="js/icons.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body data-page="home">
<a class="skip-link" href="#main">Skip to content</a>

<canvas class="shimmer" aria-hidden="true"></canvas>

<header class="nav" id="top"></header>

<main id="main">
    <!-- LANDING -->
    <section class="hero" aria-label="Introduction">
        <div class="section-bg" aria-hidden="true"><img src="assets/bg/landing.jpg" width="1600" height="1000" alt=""></div>
        <canvas class="hero-canvas" aria-hidden="true"></canvas>
        <div class="container hero-grid" id="hero"></div>
    </section>

    <!-- EXPERIENCES -->
    <section class="section" id="experiences" aria-labelledby="experiences-h">
        <div class="section-bg" aria-hidden="true"><img src="assets/bg/experiences.jpg" width="1600" height="1000" alt="" loading="lazy"></div>
        <div class="container">
        <header class="section-head reveal">
            <h2 class="eyebrow" id="experiences-h">Experiences</h2>
            <p class="lead" data-intro="EXPERIENCES"></p>
        </header>
        <ol class="timeline" id="experience-list"></ol>
        </div>
    </section>

    <!-- SKILLS -->
    <section class="section" id="skills" aria-labelledby="skills-h">
        <div class="section-bg" aria-hidden="true"><img src="assets/bg/skills.jpg" width="1600" height="1000" alt="" loading="lazy"></div>
        <div class="container">
        <header class="section-head reveal">
            <h2 class="eyebrow" id="skills-h">Skills</h2>
            <p class="lead" data-intro="SKILLS"></p>
        </header>
        <ul class="skills-grid" id="skills-grid" data-stagger="80"></ul>
        </div>
    </section>

    <!-- PROJECTS -->
    <section class="section" id="projects" aria-labelledby="projects-h">
        <div class="section-bg" aria-hidden="true"><img src="assets/bg/projects.jpg" width="1600" height="1000" alt="" loading="lazy"></div>
        <div class="container">
        <header class="section-head reveal">
            <h2 class="eyebrow" id="projects-h">Projects</h2>
            <p class="lead" data-intro="PROJECTS"></p>
        </header>
        <ul class="project-list" id="project-list" data-stagger="120"></ul>
        </div>
    </section>

    <!-- EDUCATION -->
    <section class="section" id="education" aria-labelledby="education-h">
        <div class="section-bg" aria-hidden="true"><img src="assets/bg/education.jpg" width="1600" height="1000" alt="" loading="lazy"></div>
        <div class="container">
        <header class="section-head reveal">
            <h2 class="eyebrow" id="education-h">Education</h2>
            <p class="lead" data-intro="EDUCATION"></p>
        </header>
        <ul class="edu-grid" id="edu-grid" data-stagger="100"></ul>
        </div>
    </section>

    <!-- PLANS & BLOG -->
    <section class="section" id="plans-blog" aria-labelledby="blog-h">
        <div class="section-bg" aria-hidden="true"><img src="assets/bg/plans-blog.jpg" width="1600" height="1000" alt="" loading="lazy"></div>
        <div class="container">
        <header class="section-head reveal">
            <h2 class="eyebrow" id="blog-h">Plans &amp; Blog</h2>
            <p class="lead" data-intro="BLOG"></p>
        </header>
        <div class="filter reveal" data-filter="post-grid" role="group" aria-label="Filter posts">
            <span class="pill" aria-hidden="true"></span>
            <button type="button" data-value="all" aria-pressed="true">All</button>
            <button type="button" data-value="plan" aria-pressed="false">Plans</button>
            <button type="button" data-value="post" aria-pressed="false">Blog</button>
        </div>
        <ul class="post-grid" id="post-grid" data-stagger="90"></ul>
        </div>
    </section>

    <!-- ABOUT THIS SITE -->
    <section class="section" id="about-site" aria-labelledby="about-h">
        <div class="section-bg" aria-hidden="true"><img src="assets/bg/about-site.jpg" width="1600" height="1000" alt="" loading="lazy"></div>
        <div class="container about-layout">
        <figure class="about-photo reveal" id="about-photo"></figure>
        <div class="about-text">
            <h2 class="eyebrow reveal" id="about-h">About this site</h2>
            <div class="about-paras" id="about-text" data-stagger="110"></div>
            <p class="colophon reveal" id="about-colophon"></p>
        </div>
        </div>
    </section>
</main>

<footer class="footer"></footer>

</body>
</html>
